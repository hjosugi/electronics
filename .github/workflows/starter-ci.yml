name: starter-ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: starter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install --yes ngspice shellcheck
      - name: Validate starter
        run: make validate
