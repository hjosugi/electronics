name: hardware-ci

on:
  push:
    paths:
      - "hardware/**"
      - ".github/workflows/hardware-ci.yml"
  pull_request:
    paths:
      - "hardware/**"
      - ".github/workflows/hardware-ci.yml"

permissions:
  contents: read

jobs:
  erc-drc:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kicad/kicad:10.0
      options: --user root
    steps:
      - uses: actions/checkout@v6
      - name: KiCad 10・ERC/DRC・ngspice
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/check-notebooklm.sh
          bash ./scripts/check-markdown-links.sh
          bash ./scripts/validate.sh
          bash ./scripts/check-kicad.sh

          for circuit in \
            spice/rc-transient.cir \
            spice/trrs-vcc-short.cir \
            spice/gpio-series-resistors.cir \
            spice/passive-connector-bounce.cir
          do
            echo "==> $circuit"
            ngspice -b "$circuit"
          done
