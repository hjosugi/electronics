name: hardware-ci

on:
  push:
    paths:
      - "hardware/**"
      - "tests/fixtures/kicad/**"
      - "scripts/**"
      - "spice/**"
      - "Makefile"
      - ".github/workflows/hardware-ci.yml"
  pull_request:
    paths:
      - "hardware/**"
      - "tests/fixtures/kicad/**"
      - "scripts/**"
      - "spice/**"
      - "Makefile"
      - ".github/workflows/hardware-ci.yml"

permissions:
  contents: read

concurrency:
  group: hardware-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  erc-drc:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kicad/kicad:10.0
      options: --user root
    steps:
      - uses: actions/checkout@v6
      - name: KiCad 10・ERC/DRC・ngspice
        shell: bash
        run: bash ./scripts/run-validation.sh --hardware
