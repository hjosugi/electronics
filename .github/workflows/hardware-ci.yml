name: hardware-ci

on:
  push:
    paths:
      - "hardware/**"
      - ".github/workflows/hardware-ci.yml"
  pull_request:
    paths:
      - "hardware/**"
      - ".github/workflows/hardware-ci.yml"

permissions:
  contents: read

jobs:
  erc-drc:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kicad/kicad:10.0
      options: --user root
    steps:
      - uses: actions/checkout@v6
      - name: KiCad 10・ERC/DRC・ngspice
        run: make validate-hardware
